function splitCsv(line){const out=[];let cur='',inQ=false;for(let i=0;i<line.length;i++){const ch=line[i];
 if(ch==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++}else inQ=!inQ}else if(ch===','&&!inQ){out.push(cur);cur=''}else cur+=ch}
 out.push(cur);return out.map(x=>x.trim())}
function NUM(v){const t=String(v??'').trim();if(/^-?\d+(\.\d+)?$/.test(t))return +t;return +t.replace(/\.(?=\d{3}\b)/g,'').replace(',','.').replace(/[^\d.-]/g,'')||0}
function parseTable(text){const lines=String(text).replace(/^﻿/,'').trim().split(/\r?\n/);if(!lines[0])return{head:[],rows:[]};
 const head=splitCsv(lines[0]).map(x=>x.toLowerCase().replace(/[\s-]+/g,'_'));
 return{head,rows:lines.slice(1).filter(l=>l.trim()).map(l=>{const v=splitCsv(l),o={};head.forEach((k,i)=>o[k]=v[i]??'');return o})}}
function needCols(t,cols,label){const miss=cols.filter(c=>!t.head.includes(c));if(miss.length)throw new Error('tab '+label+': kolom '+miss.join(', ')+' tidak ditemukan')}

function applyData(src,resetPeriod){
 LAST=src;const mon=src.mon,day=src.day,kz=src.kz;
 const recs=new Map();
 for(const r of mon){
  const f=ITEM_FIELD[r.item],pid=PLANT_IDS[r.plant],idx=FY_IDX[r.month],fy=Math.round(NUM(r.fiscal_year));
  if(!f||!pid||!idx||!fy)continue;
  if(/^(1|true|benar|ya|yes)$/i.test(r.is_check||''))continue; // baris verifikasi meter tidak dijumlahkan
  const key=pid+'|'+fy+'-'+idx;let rec=recs.get(key);
  if(!rec){rec={plantId:pid,period:fy+'-'+pad2(idx),electricity:0,gas:0,diesel:0,gasoline:0,water:0,discharge:0,b3:0,economic:0,updatedAt:'Google Sheet'};recs.set(key,rec)}
  rec[f]+=NUM(r.qty)*(TON_FIELDS.has(f)?1000:1);
 }
 db.records=[...recs.values()];
 db.dailyReadings=[];
 for(const r of day){
  const m=DAILY_METERS[r.plant+'|'+r.item];if(!m||!/^\d{4}-\d{2}-\d{2}/.test(r.date))continue;
  const date=r.date.slice(0,10),dow=new Date(date+'T00:00:00Z').getUTCDay();
  db.dailyReadings.push({id:'sh-'+m[2]+'-'+date,plantId:m[0],department:'Seluruh plant',type:m[1],meterId:m[2],date,mode:'daily',value:NUM(r.qty),operation:dow===0?'idle':'operating',notes:'',updatedAt:'Google Sheet'});
 }
 const TYPE_OF={'Electricity':'electricity','PGN Gas':'gas','Solar':'diesel'};
 db.kaizens=[];
 kz.forEach((r,i)=>{
  if(!r.item&&!r.title)return;
  const type=TYPE_OF[r.item]||'direct',amount=NUM(r.saving_qty_per_month),fac=type==='direct'?1000:db.settings.factors[type];
  const idx=FY_IDX[r.start_month]||1,fy=Math.round(NUM(r.start_fiscal_year))||ui.year;
  db.kaizens.push({id:r.kaizen_id||'KZN-'+(i+1),department:r.department||'',plantId:PLANT_IDS[r.plant]||'p-1',title:r.title||'(tanpa judul)',category:r.category||'Improvement',
   start:fy+'-'+pad2(idx),end:'',type,amount,monthlySavingTon:type==='direct'?amount:amount*fac/1000,
   status:/selesai|verif|berjalan|aktif|done|complete/i.test(r.status||'')?'verified':'planned',notes:r.notes||''});
 });
 const years=[...new Set(db.records.map(r=>+r.period.slice(0,4)))].sort((a,b)=>a-b);
 if(years.length&&(resetPeriod||!years.includes(ui.year))){
  ui.year=years[years.length-1];
  ui.month=Math.max(...db.records.filter(r=>+r.period.slice(0,4)===ui.year).map(r=>+r.period.slice(5)));
 }
 if(!db.plants.some(p=>p.id===ui.plant))ui.plant='all';
}

}

function plantTable(){const ps=selectedPlants();const rows=ps.map(p=>{const rec=recordsNow().filter(r=>r.plantId===p.id),s=sums(rec),b=baselinePair(rec),pct=reductionPct(s.kg,b);return{p,s,pct,count:rec.length}}).sort((a,b)=>b.s.kg-a.s.kg);return rows.length?`<div class="table-shell"><table><thead><tr><th>Plant</th><th>Emisi YTD</th><th>Reduksi vs baseline</th><th>Industrial water</th><th>Insinerasi</th><th>Detail</th></tr></thead><tbody>${rows.map(r=>`<tr><td><div class="plant-name">${h(r.p.name)}</div><div class="plant-sub">${h(r.p.code)} · ${r.count} bulan tercatat</div></td><td><b>${fmt(kgToTon(r.s.kg),1)}</b> ton</td><td><b class="${r.pct===null?'neutral':r.pct>=0?'positive':'negative'}">${r.pct===null?'—':(r.pct>=0?'↓ ':'↑ ')+fmt(Math.abs(r.pct),1)+'%'}</b></td><td>${nf(r.s.water)} m³</td><td>${fmt(kgToTon(r.s.b3),2)} ton</td><td><button class="linkish" data-action="filter-plant" data-id="${h(r.p.id)}">Lihat plant →</button></td></tr>`).join('')}</tbody></table></div>`:empty('Belum ada plant')}
function overview(){const st=getStats(),pct=st.pct,target=sv(db.settings.targetReductionPct),progress=pct===null?0:Math.max(0,Math.min(100,pct/Math.max(.1,target)*100));const trendActual=trend(),baseline=baselineTrend();const ks=relevantKaizens().slice().sort((a,b)=>b.start.localeCompare(a.start)).slice(0,4);
 return `<div class="hero"><div class="hero-copy"><div class="eyebrow">✦ SUSTAINABILITY PERFORMANCE MONITOR</div><h2>One view. Every plant.<br>Measurable environmental impact.</h2><p>Pantau emisi, pemakaian sumber daya, timbulan limbah, dan hasil Kaizen dalam satu ruang kerja.</p><div class="tag-row" style="margin-top:14px"><span class="dark-tag">${selectedPlants().length} plant dipilih</span><span class="dark-tag">FY${ui.year} · Apr–${MONTHS[ui.month-1]}</span><span class="dark-tag">Data aktual</span></div></div><div class="hero-right"><small>Target pengurangan vs baseline</small><strong>${fmt(target,1)}%</strong><span>Baseline ${db.settings.baselineYear} · dihitung dari emisi aktual</span></div></div>
 <div class="grid-kpis">${kpi('Total Emisi CO₂e',fmt(kgToTon(st.s.kg),1),'ton','Realisasi energi · YTD','bolt')}${kpi('Penurunan Emisi',pct===null?'—':fmt(pct,1)+'%','',`vs baseline ${db.settings.baselineYear} · periode setara`,'down','blue')}${kpi('Kaizen Terealisasi',fmt(st.kaizenLifetime,1),'ton CO₂e','Kumulatif sejak mulai · proyek terverifikasi','leaf')}${kpi('Industrial Water',nf(st.s.water),'m³','Total konsumsi air industri · YTD','water','blue')}${kpi('Limbah insinerasi',fmt(kgToTon(st.s.b3),2),'ton','Total timbulan · YTD','waste','red')}${kpi('Valuable Waste (dijual)',fmt(kgToTon(st.s.economic),2),'ton','Total timbulan · YTD','recycle','orange')}</div>
 ${noticeCoverage(st)}
  ${dailyOverviewAlerts()}
  <div class="two-col section-space"><section class="card card-pad">${header('CO₂e Emission Trend','Perbandingan emisi energi aktual terhadap baseline bulanan',`<div class="legend"><span><i style="background:${COLORS[0]}"></i>${ui.year} aktual</span><span><i style="background:#9cb7ac"></i>${db.settings.baselineYear} baseline</span></div>`)}<div class="chart-wrap">${chart([{name:'Aktual',color:COLORS[0],values:trendActual},{name:'Baseline',color:'#9cb7ac',dashed:true,values:ui.year===Number(db.settings.baselineYear)?[]:baseline}])}</div></section><section class="card card-pad">${header('Emission by Source','Komposisi emisi dari energi yang dilaporkan')}${donut(st.s)}<div class="thin-rule"></div><div class="progress-top"><span>Progress target pengurangan</span><b class="${pct!==null&&pct>=0?'positive':'negative'}">${pct===null?'—':fmt(pct,1)+'%'} / ${fmt(target,0)}%</b></div><div class="progress"><div style="width:${progress}%"></div></div><p class="footnote">Reduksi aktual dinilai terhadap baseline. Estimasi Kaizen ditampilkan terpisah dan <b>tidak dikurangkan lagi</b> dari emisi aktual.</p></section></div>
 <div class="two-col section-space"><section class="card card-pad">${header('Plant Performance','Ringkasan performa setiap plant pada periode terpilih',`<button class="btn small" data-nav="energy">Detail energi ${ico.bolt}</button>`)}<div style="margin-top:15px">${plantTable()}</div></section><section class="card card-pad">${header('Kaizen Highlights','Aktivitas improvement terakhir',`<button class="btn small" data-nav="kaizen">Lihat semua</button>`)}<div class="insight-list">${ks.length?ks.map(k=>`<div class="insight-row"><div class="insight-icon">${ico.leaf}</div><div style="min-width:0;flex:1"><div class="insight-title">${h(k.title)}</div><div class="insight-desc">${h(plantName(k.plantId))} · ${h(k.start)} · ${k.status==='verified'?'Terverifikasi':'Rencana'}</div></div><b class="${k.status==='verified'?'positive':'muted'}" style="white-space:nowrap;font-size:11px">${fmt(k.monthlySavingTon,2)} t/bln</b></div>`).join(''):empty('Belum ada aktivitas Kaizen')}</div></section></div>
 <p class="footnote">* Data aktual PT TJFI dari Google Spreadsheet (tahun fiskal April–Maret). Koefisien: Listrik 0,443 kg CO₂e/kWh, PGN Gas 2,23 kg CO₂e/m³, Solar 2,58 kg CO₂e/liter. Data produksi (Ton), rincian listrik per area, dan register Kaizen akan muncul setelah diisi di Sheet. Pemakaian harian tidak dijumlahkan ke total bulanan.</p>`;
}
function energy(){const st=getStats(),f=db.settings.factors,rows=st.rows.slice().sort((a,b)=>b.period.localeCompare(a.period)||plantName(a.plantId).localeCompare(plantName(b.plantId)));
 return `${pageIntro('Energy Consumption & CO₂e','Monitoring input energi dan estimasi emisi Scope 1 & Scope 2 operasional.',`<button class="btn btn-primary" data-action="new-consumption">Input data</button><button class="btn" data-nav="daily">Meter gas harian</button><button class="btn" data-action="export-csv">${ico.download} Ekspor CSV</button>`)}
 <div class="metric-compact"><div class="card"><div class="label">Listrik</div><div class="value">${nf(st.s.electricity)}<span class="unit">kWh</span></div></div><div class="card"><div class="label">Gas alam</div><div class="value">${nf(st.s.gas)}<span class="unit">m³</span></div></div><div class="card"><div class="label">Bahan bakar · Solar</div><div class="value">${nf(st.s.diesel+st.s.gasoline)}<span class="unit">liter</span></div></div></div>
 ${noticeCoverage(st)}<div class="two-col section-space"><section class="card card-pad">${header('Emisi CO₂e per Bulan','ton CO₂e · seluruh sumber energi terpilih')}<div class="chart-wrap">${chart([{name:'Aktual',values:trend(),color:COLORS[0]},{name:'Baseline',values:ui.year===Number(db.settings.baselineYear)?[]:baselineTrend(),color:'#a6beb1',dashed:true}])}</div></section><section class="card card-pad">${header('Kontribusi Tiap Energi','Estimasi CO₂e dari faktor yang sedang digunakan')}${donut(st.s)}<p class="footnote">Listrik diklasifikasikan sebagai Scope 2; pembakaran bahan bakar dan gas yang dikendalikan perusahaan umumnya Scope 1. Faktor dan batas organisasi wajib diverifikasi.</p></section></div>
 <section class="card card-pad section-space">${header('Log Konsumsi & Emisi','Klik edit untuk memuat kembali data plant dan bulan ke formulir')}${rows.length?`<div class="table-shell" style="margin-top:15px"><table><thead><tr><th>Periode</th><th>Plant</th><th>Listrik (kWh)</th><th>Gas (m³)</th><th>Solar (L)</th><th>CO₂e (ton)</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${h(r.period)}</td><td><b>${h(plantName(r.plantId))}</b></td><td>${nf(r.electricity)}</td><td>${nf(r.gas)}</td><td>${nf(r.diesel)}</td><td><b>${fmt(kgToTon(emission(r)),2)}</b></td></tr>`).join('')}</tbody></table></div>`:empty('Belum ada data konsumsi')}</section>
 <div class="notice">Faktor emisi resmi TJFI yang aktif: listrik ${f.electricity} kg CO₂e/kWh; gas ${f.gas} kg CO₂e/m³; solar ${f.diesel} kg CO₂e/L. Ubah di <button class="linkish" data-nav="settings">Pengaturan</button>.</div>`;
}
function water(){const st=getStats(),rows=st.rows.slice().sort((a,b)=>b.period.localeCompare(a.period));const water=trend('water'),b3=trend('b3'),econ=trend('economic');return `${pageIntro('Industrial Water & Waste','Pantau konsumsi air, limbah insinerasi, dan valuable waste (dijual) per plant.',`<button class="btn btn-primary" data-action="new-consumption">Input data</button><button class="btn" data-nav="daily">Pantau air harian</button><button class="btn" data-action="export-csv">${ico.download} Ekspor CSV</button>`)}
 <div class="metric-compact"><div class="card"><div class="label">Industrial water YTD</div><div class="value">${nf(st.s.water)}<span class="unit">m³</span></div></div><div class="card"><div class="label">Discharge water (sewage) YTD</div><div class="value">${nf(st.s.discharge)}<span class="unit">m³</span></div></div><div class="card"><div class="label">Timbulan limbah insinerasi YTD</div><div class="value">${fmt(st.s.b3/1000,2)}<span class="unit">ton</span></div></div><div class="card"><div class="label">Valuable waste (dijual) YTD</div><div class="value">${fmt(st.s.economic/1000,2)}<span class="unit">ton</span></div></div></div>
 ${noticeCoverage(st)}<div class="two-col section-space"><section class="card card-pad">${header('Industrial Water Trend','Konsumsi air industri bulanan · m³')}<div class="chart-wrap">${chart([{name:'Industrial water',values:water,color:COLORS[1]}],'m³')}</div></section><section class="card card-pad">${header('Waste Generation Trend','Limbah insinerasi dan valuable waste · kg')}<div class="chart-wrap">${chart([{name:'Insinerasi',values:b3,color:COLORS[3]},{name:'Valuable waste (dijual)',values:econ,color:COLORS[2]}],'kg')}</div><div class="legend"><span><i style="background:${COLORS[3]}"></i>Limbah insinerasi</span><span><i style="background:${COLORS[2]}"></i>Valuable waste (dijual)</span></div></section></div>
 <section class="card card-pad section-space">${header('Water & Waste Log','Rekap per bulan dan plant')}${rows.length?`<div class="table-shell" style="margin-top:15px"><table><thead><tr><th>Periode</th><th>Plant</th><th>Industrial water (m³)</th><th>Limbah insinerasi (kg)</th><th>Valuable waste (dijual) (kg)</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${h(r.period)}</td><td><b>${h(plantName(r.plantId))}</b></td><td>${nf(r.water)}</td><td>${nf(r.b3)}</td><td>${nf(r.economic)}</td></tr>`).join('')}</tbody></table></div>`:empty('Belum ada data air dan limbah')}</section><p class="footnote">Satuan limbah diinput kg dan ditampilkan juga dalam ton. Data ini adalah total timbulan, belum dilengkapi manifest, transporter, tujuan pengolahan, atau klasifikasi detail limbah.</p>`}
function kaizen(){const ks=relevantKaizens().slice().sort((a,b)=>b.start.localeCompare(a.start)),st=getStats();const monthly=ks.filter(k=>k.status==='verified'&&k.start<=ym(ui.year,ui.month)&&(!k.end||k.end>=ym(ui.year,ui.month))).reduce((a,k)=>a+sv(k.monthlySavingTon),0);let totalPlanned=ks.filter(k=>k.status==='planned').reduce((a,k)=>a+sv(k.monthlySavingTon),0);
 return `${pageIntro('Kaizen CO₂e Reduction Tracker','Penghematan bulanan yang diverifikasi dan diakumulasi berdasarkan tanggal efektif.',`<button class="btn btn-primary" data-action="new-kaizen">Input Kaizen</button><button class="btn" data-action="export-kaizen">${ico.download} Ekspor CSV</button>`)}
 <div class="metric-compact"><div class="card"><div class="label">Kumulatif sejak mulai</div><div class="value">${fmt(st.kaizenLifetime,2)}<span class="unit">ton CO₂e</span></div></div><div class="card"><div class="label">Realisasi dalam ${ui.year}</div><div class="value">${fmt(st.kaizenYtd,2)}<span class="unit">ton CO₂e</span></div></div><div class="card"><div class="label">Pengurangan berjalan per bulan</div><div class="value">${fmt(monthly,2)}<span class="unit">ton/bln</span></div></div></div>
 <div class="two-col section-space"><section class="card card-pad">${header('Akumulasi Kaizen Bulanan','Kumulatif capaian terverifikasi sejak awal tahun ini')}<div class="chart-wrap">${chart([{name:'Kumulatif Kaizen YTD',color:COLORS[0],values:Array.from({length:ui.month},(_,i)=>ks.reduce((a,k)=>a+kaizenStats(k,ym(ui.year,i+1)).ytd,0))}],'ton CO₂e')}</div></section><section class="card card-pad">${header('Status Improvement','Proyek Kaizen berdasarkan status pencatatan')}<div class="inline-stat"><span>Proyek terverifikasi</span><b class="positive">${st.verified} proyek</b></div><div class="inline-stat"><span>Proyek masih rencana</span><b>${st.planned} proyek</b></div><div class="inline-stat"><span>Potensi rencana (belum dihitung)</span><b>${fmt(totalPlanned,2)} ton/bln</b></div><div class="notice notice-green">Kumulatif dihitung dari tanggal mulai sampai bulan filter, atau tanggal selesai jika diisi. Hanya status <b>Terverifikasi</b> yang masuk realisasi.</div></section></div>
 <section class="card card-pad section-space">${header('Kaizen Improvement Register','Daftar aktivitas; pilih Edit untuk memperbarui perhitungan atau status')}${ks.length?`<div class="table-shell" style="margin-top:15px"><table><thead><tr><th>Aktivitas / Plant</th><th>Efektif</th><th>Status</th><th>Pengurangan/bln</th><th>Realisasi YTD</th><th>Total Kumulatif</th></tr></thead><tbody>${ks.map(k=>{const a=kaizenStats(k);return `<tr><td><div class="plant-name">${h(k.title)}</div><div class="plant-sub">${h(plantName(k.plantId))} / ${h(k.department||'Belum ditentukan')} · ${h(k.category||'Improvement')}</div></td><td>${h(k.start)}${k.end?'<div class="plant-sub">s.d. '+h(k.end)+'</div>':''}</td><td><span class="data-badge ${k.status==='verified'?'success-badge':'pending-badge'}">${k.status==='verified'?'Terverifikasi':'Rencana'}</span></td><td><b>${fmt(k.monthlySavingTon,3)}</b> ton</td><td>${fmt(a.ytd,2)} ton</td><td><b>${fmt(a.lifetime,2)}</b> ton</td></tr>`}).join('')}</tbody></table></div>`:empty('Belum ada Kaizen')}</section><p class="footnote">Angka Kaizen merupakan perhitungan manfaat improvement berdasarkan data dan status yang diinput. Sistem tidak menambahkan manfaat Kaizen ke penurunan aktual agar tidak menghitung pengurangan yang sama dua kali.</p>`;
}
function plantOptions(current){return db.plants.map(p=>`<option value="${h(p.id)}" ${p.id===current?'selected':''}>${h(p.name)}</option>`).join('')}
function inputConsumption(){const rec=db.records.find(r=>r.plantId===ui.entryPlant&&r.period===ui.entryPeriod)||{};const get=(k)=>rec[k]??'';return `<div class="input-layout"><section class="card card-pad"><form id="recordForm"><div class="form-grid"><div class="field"><label for="entryPlant">Plant *</label><select id="entryPlant" required>${plantOptions(ui.entryPlant)}</select></div><div class="field"><label for="entryPeriod">Periode (bulan) *</label><input id="entryPeriod" type="month" required value="${h(ui.entryPeriod)}"></div><div class="form-section-label">ENERGY CONSUMPTION</div><div class="field"><label for="electricity">Konsumsi listrik (kWh)</label><input id="electricity" type="number" min="0" step="any" value="${get('electricity')}" placeholder="Contoh: 125000"></div><div class="field"><label for="gas">Gas alam (m³)</label><input id="gas" type="number" min="0" step="any" value="${get('gas')}" placeholder="Contoh: 8000"></div><div class="field"><label for="diesel">Solar / Diesel (liter)</label><input id="diesel" type="number" min="0" step="any" value="${get('diesel')}" placeholder="Contoh: 3500"></div><div class="field"><label for="gasoline">Bensin (liter)</label><input id="gasoline" type="number" min="0" step="any" value="${get('gasoline')}" placeholder="Contoh: 800"></div><div class="form-section-label">INDUSTRIAL WATER & WASTE</div><div class="field"><label for="water">Industrial water (m³)</label><input id="water" type="number" min="0" step="any" value="${get('water')}" placeholder="Contoh: 10000"></div><div class="field"><label for="b3">Limbah insinerasi (kg)</label><input id="b3" type="number" min="0" step="any" value="${get('b3')}" placeholder="Contoh: 2200"></div><div class="field"><label for="economic">Valuable waste (dijual) (kg)</label><input id="economic" type="number" min="0" step="any" value="${get('economic')}" placeholder="Contoh: 3900"></div><div class="field" style="justify-content:end"><small>Masukkan angka 0 bila memang tidak ada pemakaian atau timbulan. Kosong dibaca 0 pada prototipe.</small></div></div><div class="form-actions"><button class="btn btn-primary" type="submit">Simpan Data Bulanan</button><button class="btn" type="button" data-action="clear-consumption">Buat input baru</button></div></form></section>
 <aside><div class="preview-panel"><small>LIVE CO₂e CALCULATION</small><div class="preview-value" id="recordTotal">0,00 <span>ton CO₂e</span></div><div class="preview-row"><span>Listrik</span><strong id="e-electricity">0 kg</strong></div><div class="preview-row"><span>Gas alam</span><strong id="e-gas">0 kg</strong></div><div class="preview-row"><span>Solar</span><strong id="e-diesel">0 kg</strong></div><div class="preview-row"><span>Bensin</span><strong id="e-gasoline">0 kg</strong></div></div><div class="card card-pad section-space"><h3 class="card-heading">Petunjuk Input</h3><p class="card-note" style="line-height:1.7;margin-top:9px">Satu record untuk kombinasi <b>plant + bulan</b>. Jika data sudah ada, formulir otomatis menampilkan nilai sebelumnya, lalu penyimpanan akan memperbaruinya.</p><div class="notice notice-green">Gunakan faktor emisi yang telah disetujui perusahaan. Nilai bawaan adalah koefisien resmi TJFI.</div><button class="btn" data-nav="settings">Atur faktor emisi</button></div></aside></div>`}
function inputKaizen(){const k=db.kaizens.find(z=>z.id===ui.editingKaizen)||{},type=k.type||'electricity';return `<div class="input-layout"><section class="card card-pad"><form id="kaizenForm"><div class="form-grid"><div class="field full"><label for="kTitle">Nama aktivitas Kaizen *</label><input id="kTitle" required maxlength="150" placeholder="Contoh: Optimasi motor kompresor" value="${h(k.title||'')}"></div><div class="field"><label for="kPlant">Plant *</label><select id="kPlant" required>${plantOptions(k.plantId||ui.entryPlant)}</select></div><div class="field"><label for="kDepartment">Departemen pelaksana *</label><select id="kDepartment" required>${departmentOptions(k.plantId||ui.entryPlant,k.department||'')}</select></div><div class="field"><label for="kCategory">Kategori improvement</label><select id="kCategory">${['Efisiensi energi','Optimasi proses','Perilaku operasional','Penggantian peralatan','Lainnya'].map(x=>`<option ${k.category===x?'selected':''}>${h(x)}</option>`).join('')}</select></div><div class="field"><label for="kStart">Tanggal efektif (bulan) *</label><input type="month" id="kStart" required value="${h(k.start||ui.entryPeriod)}"></div><div class="field"><label for="kEnd">Bulan selesai (opsional)</label><input type="month" id="kEnd" value="${h(k.end||'')}"></div><div class="field"><label for="kStatus">Status verifikasi *</label><select id="kStatus"><option value="planned" ${k.status==='planned'?'selected':''}>Rencana (tidak dihitung)</option><option value="verified" ${k.status==='verified'?'selected':''}>Terverifikasi (dihitung)</option></select></div><div class="field"><label for="kType">Basis pengurangan per bulan *</label><select id="kType">${Object.entries(TYPES).map(([val,item])=>`<option value="${val}" ${type===val?'selected':''}>${h(item.label)}</option>`).join('')}</select></div><div class="field full"><label id="kAmountLabel" for="kAmount">Penghematan listrik per bulan (kWh)</label><input id="kAmount" type="number" required min="0" step="any" value="${k.amount??''}" placeholder="Masukkan besaran penghematan per bulan"><small id="kAmountHelp">Jika basis energi dipilih, sistem mengalikan penghematan dengan faktor emisi yang aktif.</small></div><div class="field full"><label for="kNotes">Keterangan dan dasar verifikasi</label><textarea id="kNotes" placeholder="Catatan pengukuran, bukti saving, referensi perhitungan...">${h(k.notes||'')}</textarea></div></div><div class="form-actions"><button type="submit" class="btn btn-primary">${ui.editingKaizen?'Perbarui Kaizen':'Simpan Kaizen'}</button><button type="button" class="btn" data-action="new-kaizen">Reset formulir</button></div></form></section>
 <aside><div class="preview-panel"><small>ESTIMASI PENGURANGAN BULANAN</small><div class="preview-value" id="kPreview">0,00 <span>ton CO₂e/bln</span></div><div class="preview-row"><span>Besaran penghematan</span><strong id="kSavingAmount">—</strong></div><div class="preview-row"><span>Faktor emisi</span><strong id="kFactor">—</strong></div><div class="preview-row"><span>Status</span><strong id="kStatusLabel">Rencana</strong></div></div><div class="card card-pad section-space"><h3 class="card-heading">Aturan Kumulatif</h3><div class="insight-list"><div class="insight-row"><div class="insight-icon">${ico.leaf}</div><div><div class="insight-title">Hanya terverifikasi</div><div class="insight-desc">Kaizen berstatus rencana tidak masuk realisasi.</div></div></div><div class="insight-row"><div class="insight-icon">${ico.down}</div><div><div class="insight-title">Diakumulasi bulanan</div><div class="insight-desc">Saving bulanan dihitung sejak bulan mulai sampai bulan filter atau bulan selesai.</div></div></div></div><div class="notice">Saving yang dimasukkan dianggap tetap tiap bulan. Untuk perubahan saving dari waktu ke waktu, diperlukan modul verifikasi bulanan dalam versi produksi.</div></div></aside></div>`}

function departmentsFor(plantId){return db.plants.find(p=>p.id===plantId)?.departments||[]}
function departmentOptions(plantId,current=''){return '<option value="">Pilih departemen</option>'+departmentsFor(plantId).map(d=>`<option value="${h(d)}" ${d===current?'selected':''}>${h(d)}</option>`).join('')}
function isoDayGap(dateA,dateB){return Math.round((Date.parse(dateB+'T00:00:00Z')-Date.parse(dateA+'T00:00:00Z'))/86400000)}
function med(vals){const sorted=vals.slice().sort((a,b)=>a-b);return sorted.length?(sorted[Math.floor((sorted.length-1)/2)]+sorted[Math.floor(sorted.length/2)])/2:null}
function dailyAnalyzed(){
 const groups=new Map();for(const r of db.dailyReadings||[]){const key=[r.plantId,r.type,r.meterId.trim().toUpperCase()].join('||');if(!groups.has(key))groups.set(key,[]);groups.get(key).push(r)}
 const results=[];
 for(const arr of groups.values()){
  arr.sort((a,b)=>a.date.localeCompare(b.date));
  const history=[];let last=null;
  for(const row of arr){
   let volume=null,status='baseline',cause='Pembacaan awal (baseline)';
   const mode=row.mode||'meter',value=Number(row.value),gap=last?isoDayGap(last.date,row.date):null;
   if(mode==='daily'){
    volume=value;status='normal';cause='Konsumsi harian diinput langsung';
   }else if(last&&last.mode!=='daily'&&gap===1){
    if(value>=Number(last.value)){volume=value-Number(last.value);status='normal';cause='Selisih meter dibandingkan hari sebelumnya'}
    else{status='reset';cause='Meter turun: reset, penggantian, atau salah input'}
   }else if(last&&last.mode!=='daily'&&gap>1){status='gap';cause=`Jeda ${gap} hari: selisih meter bukan konsumsi satu hari`}
   else if(last&&last.mode==='daily'){status='baseline';cause='Peralihan metode input, mulai baseline meter baru'}
   const previousOperational=history.filter(d=>d.volume!==null&&d.status!=='gap'&&d.status!=='reset'&&d.row.operation==='operating').slice(-7).map(d=>d.volume);
   const median=previousOperational.length>=3?med(previousOperational):null;
   if(volume!==null){
    const minInc=row.type==='gas'?db.settings.gasMinimumIncrease:db.settings.waterMinimumIncrease;
    const idleMax=row.type==='gas'?db.settings.gasIdleLimit:db.settings.waterIdleLimit;
    if(row.operation==='idle'&&volume>idleMax){status='alert';cause='Ada pemakaian saat kondisi non-operasi'}
    else if(median!==null&&volume>median*(1+db.settings.dailyAlertPct/100)&&volume-median>=minInc){status='alert';cause=`Naik >${nf(db.settings.dailyAlertPct)}% dari median historis (${nf(median,1)} m³)`}
   }
   const analyzed={row,volume,status,cause,median,gap};history.push(analyzed);results.push(analyzed);last=row;
  }
 }
 return results;
}
function dailyPlantOK(x){return x.row.type==='gas'?x.row.plantId==='p-1':(ui.plant==='all'||x.row.plantId===ui.plant)}
function dailyScope(type=ui.dailyType){return dailyAnalyzed().filter(x=>x.row.type===type&&dailyPlantOK(x)&&dfp(x.row.date)===ym(ui.year,ui.month)&&(ui.dailyDept==='all'||x.row.department===ui.dailyDept)).sort((a,b)=>b.row.date.localeCompare(a.row.date)||plantName(a.row.plantId).localeCompare(plantName(b.row.plantId)))}
function dailyBadge(s){return s==='alert'?'<span class="daily-badge daily-danger">Periksa ⚠</span>':s==='normal'?'<span class="daily-badge daily-good">Normal</span>':s==='gap'?'<span class="daily-badge daily-warn">Data terlewat</span>':s==='reset'?'<span class="daily-badge daily-danger">Periksa meter</span>':'<span class="daily-badge daily-unknown">Baseline</span>'}
function monthDays(){const i=ui.month,m=i<=9?i+3:i-9,y=i<=9?ui.year:ui.year+1;return{y,m,n:new Date(y,m,0).getDate()}}
function monthChart(rows,color,label){
 const {y,m,n}=monthDays(),pad=v=>String(v).padStart(2,'0'),by=new Map();
 for(const x of rows){if(x.volume===null)continue;const d=+x.row.date.slice(8,10),e=by.get(d)||{v:0,alert:false};e.v+=x.volume;e.alert=e.alert||x.status==='alert';by.set(d,e)}
 if(!by.size)return `<div class="plant-sub" style="padding:18px 0">${h(label)}: belum ada data harian pada ${MONTHS[ui.month-1]} ${ui.year}.</div>`;
 const W=760,H=190,L=54,R=14,T=14,B=30,max=Math.max(1,...[...by.values()].map(e=>e.v))*1.2,w=(W-L-R)/n;
 let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik konsumsi harian ${h(label)}">`;
 for(let k=0;k<5;k++){const yy=T+(H-T-B)*k/4,v=max*(1-k/4);svg+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="#e4ebe8" stroke-dasharray="4 4"/><text x="${L-7}" y="${yy+4}" text-anchor="end" font-size="11" fill="#84958e">${nf(v,0)}</text>`}
 for(let d=1;d<=n;d++){const e=by.get(d),x=L+(d-1)*w+w*.15;
  if(e){const bar=Math.max(1,e.v/max*(H-T-B));svg+=`<rect x="${x}" y="${H-B-bar}" width="${Math.max(3,w*.7)}" height="${bar}" rx="2" fill="${e.alert?'#d76467':color}"><title>${pad(d)}/${pad(m)}/${y} • ${h(label)} • ${nf(e.v,2)} m³${e.alert?' • perlu pemeriksaan':''}</title></rect>`}
  if(d===1||d%2===1||d===n)svg+=`<text x="${x+w*.35}" y="${H-14}" text-anchor="middle" font-size="10" fill="#7e918a">${d}</text>`}
 svg+=`<text x="${W-R}" y="${H-2}" text-anchor="end" font-size="10" fill="#75877f">Tanggal 1–${n} · merah = indikasi anomali</text></svg>`;return svg;
}

const WRITE_URL='https://script.google.com/macros/s/AKfycbxaC-ox-PZi3ekOnUsLTsVaL3j2vSA0yvibUYgRDXpt6AvzB0mTmfN9Z0-tRqldcWpM/exec';
const WKEY='tjfi-write-url-v1',PKEY='tjfi-passcode-v1';
function writeUrl(){try{return WRITE_URL||localStorage.getItem(WKEY)||''}catch(e){return WRITE_URL}}

const PENDING={mon:[],day:[],kz:[]},PEND_MS=20*60*1000;
const kMon=r=>[r.fiscal_year,r.month,r.plant,r.item,r.sub_area||''].join('|'),kDay=r=>[String(r.date).slice(0,10),r.plant,r.item].join('|'),kKz=r=>r.kaizen_id;
function upsertBy(arr,fn,row){const k=fn(row),i=arr.findIndex(x=>fn(x)===k);if(i>=0)arr[i]=row;else arr.push(row)}
function addPending(t,row){PENDING[t].push({t:Date.now(),row})}
function mergePending(src){const now=Date.now();const fns={mon:kMon,day:kDay,kz:kKz};for(const t of ['mon','day','kz']){PENDING[t]=PENDING[t].filter(p=>now-p.t<PEND_MS);for(const p of PENDING[t])upsertBy(src[t],fns[t],p.row)}}
async function sendToSheet(payload){
 const url=writeUrl();if(!url)throw new Error('Alamat Apps Script belum diatur.');
 const pc=(document.getElementById('fPass')?.value||passcode()).trim();if(!pc)throw new Error('Kode akses wajib diisi.');
 const r=await fetch(url,{method:'POST',body:JSON.stringify({...payload,passcode:pc})});
 let j;try{j=await r.json()}catch(e){throw new Error('Respons server tidak terbaca (HTTP '+r.status+').')}
 if(!j.ok)throw new Error(j.error||'Gagal menyimpan.');
 try{localStorage.setItem(PKEY,pc)}catch(e){}
 return j;
}

 <div class="form-section-label">PEMAKAIAN HARIAN${dow===0?' · HARI MINGGU (NON-OPERASI)':''}</div>
 ${ui.dPlant==='p-1'?`<div class="field"><label for="d_gas">Gas alam PGN (m³)</label><input id="d_gas" type="number" min="0" step="any" inputmode="decimal" value="${h(g('PGN Gas'))}" placeholder="m³ per hari"></div>`:''}
 <div class="field"><label for="d_water">Industrial water / supplied (m³)</label><input id="d_water" type="number" min="0" step="any" inputmode="decimal" value="${h(g('Supplied Water (Industrial Water)'))}" placeholder="m³ per hari"></div>
 <div class="field"><label for="d_disc">Discharge water / sewage (m³)</label><input id="d_disc" type="number" min="0" step="any" inputmode="decimal" value="${h(g('Discharge Water (Sewage)'))}" placeholder="m³ per hari"></div>
 ${passField()}</div><div class="form-actions"><button class="btn btn-primary" type="submit">Simpan ke Google Sheet</button></div></form></section>
 <aside><div class="card card-pad"><h3 class="card-heading">Petunjuk</h3><p class="card-note" style="line-height:1.7;margin-top:9px">Isi total pemakaian satu hari (bukan angka meter kumulatif). PGN Gas hanya ada di Plant 1. Mengisi tanggal yang sudah ada akan memperbarui nilainya. Hari Minggu otomatis dianggap non-operasi untuk deteksi kebocoran.</p></div></aside></div>`;
}
const KUNIT={'Electricity':'kWh','PGN Gas':'m³','Solar':'liter'};
function kaizenEntryForm(){
 ui.kzSel=ui.kzSel||'';
 const cur=ui.kzSel?(LAST?.kz||[]).find(r=>r.kaizen_id===ui.kzSel):null,v=(k,d='')=>cur?(cur[k]??d):d;
 const plant=cur?.plant||'Plant 1',item=cur?.item||'Electricity',fy=Math.round(NUM(cur?.start_fiscal_year))||ui.year,sm=cur?.start_month||'Apr';
 const st=/selesai|verif|done|complete/i.test(v('status'))?'Selesai':/berjalan|aktif/i.test(v('status'))?'Berjalan':'Rencana';
 return `<div class="input-layout"><section class="card card-pad"><form id="fKaizen" data-live="1"><div class="form-grid">
 <div class="field full"><label for="kzSel">Kaizen yang diedit</label><select id="kzSel"><option value="">— Kaizen baru —</option>${(LAST?.kz||[]).filter(r=>r.kaizen_id).map(r=>`<option value="${h(r.kaizen_id)}" ${r.kaizen_id===ui.kzSel?'selected':''}>${h(r.kaizen_id)} · ${h(r.title)}</option>`).join('')}</select></div>
 <div class="field full"><label for="kzTitle">Nama aktivitas Kaizen *</label><input id="kzTitle" required maxlength="150" placeholder="Contoh: Optimasi motor kompresor" value="${h(v('title'))}"></div>
 <div class="field"><label for="kzCat">Kategori</label><input id="kzCat" maxlength="60" placeholder="Contoh: Energy saving" value="${h(v('category'))}"></div>
 <div class="field"><label for="kzPlant">Plant *</label><select id="kzPlant"><option ${plant==='Plant 1'?'selected':''}>Plant 1</option><option ${plant==='Plant 2'?'selected':''}>Plant 2</option></select></div>
 <div class="field"><label for="kzItem">Sumber yang dihemat *</label><select id="kzItem">${['Electricity','PGN Gas','Solar'].map(i=>`<option value="${i}" ${i===item?'selected':''}>${i}</option>`).join('')}</select></div>
 <div class="field"><label for="kzQty" id="kzQtyLbl">Penghematan per bulan (${KUNIT[item]}) *</label><input id="kzQty" type="number" min="0" step="any" inputmode="decimal" required value="${h(v('saving_qty_per_month'))}"></div>
 <div class="field"><label for="kzFy">Mulai tahun fiskal *</label><select id="kzFy">${fyOptions(fy)}</select></div>
 <div class="field"><label for="kzMonth">Mulai bulan *</label><select id="kzMonth">${MONTHS.map(m=>`<option ${m===sm?'selected':''}>${m}</option>`).join('')}</select></div>
 <div class="field"><label for="kzStatus">Status *</label><select id="kzStatus">${['Rencana','Berjalan','Selesai'].map(x=>`<option ${x===st?'selected':''}>${x}</option>`).join('')}</select></div>
 <div class="field"><label for="kzPic">PIC</label><input id="kzPic" maxlength="80" value="${h(v('pic'))}"></div>
 <div class="field full"><label for="kzNotes">Catatan</label><textarea id="kzNotes" placeholder="Metode perhitungan, bukti verifikasi, dsb.">${h(v('notes'))}</textarea></div>
 ${passField()}</div><div class="form-actions"><button class="btn btn-primary" type="submit">Simpan ke Google Sheet</button></div></form></section>
 <aside><div class="card card-pad"><h3 class="card-heading">Aturan Kaizen</h3><p class="card-note" style="line-height:1.7;margin-top:9px">Hanya status <b>Berjalan</b> dan <b>Selesai</b> yang dihitung sebagai realisasi pengurangan CO₂e; <b>Rencana</b> ditampilkan terpisah. Penghematan dihitung dari jumlah per bulan × koefisien emisi, sejak bulan mulai.</p></div></aside></div>`;
}
function input(){
 if(!['monthly','daily','kaizen','source'].includes(ui.tab))ui.tab='monthly';
 const tabs=[['monthly','⚡ Data Bulanan'],['daily','💧 Gas & Air Harian'],['kaizen','♻ Kaizen'],['source','🔗 Sumber Data']];
 const on=!!writeUrl();
 return `${pageIntro('Input Data','Data disimpan langsung ke Google Sheet dan menjadi sumber seluruh dashboard.',`<span class="chip">${on?'Terhubung ke Google Sheet':'Input belum diaktifkan'}</span>`)}
 <div class="tabs">${tabs.map(([k,l])=>`<button class="tab ${ui.tab===k?'active':''}" data-action="in-tab" data-tab="${k}">${l}</button>`).join('')}</div>
 ${ui.tab==='source'?sourceInfo():!on?setupCard():ui.tab==='monthly'?monthlyForm():ui.tab==='daily'?dailyEntryForm():kaizenEntryForm()}`;
}
async function handleLiveSubmit(id){
 const btn=document.querySelector('#'+id+' button[type=submit]');const old=btn?.textContent;if(btn){btn.disabled=true;btn.textContent='Menyimpan…'}
 try{
  if(id==='fMonthly'){
   const pn=plantLabel(ui.mPlant),mon=MONTHS[ui.mMonth-1],rows=[];
   for(const m of MITEMS){const el=document.getElementById('m_'+m[0]);if(!el||el.value==='')continue;rows.push({fiscal_year:ui.mFy,month:mon,plant:pn,item:m[1],qty:Number(el.value)})}
   if(!rows.length)throw new Error('Isi minimal satu kolom.');
   const j=await sendToSheet({type:'monitoring',rows});
   rows.forEach(r=>{const row={...r,sub_area:'',is_check:'FALSE'};addPending('mon',row)});
   toast(`Tersimpan di Google Sheet (${j.inserted||0} baru, ${j.updated||0} diperbarui).`);
  }else if(id==='fDaily'){
   const pn=plantLabel(ui.dPlant),rows=[];
   const add=(el,item)=>{const e=document.getElementById(el);if(e&&e.value!=='')rows.push({date:ui.dDate,plant:pn,item,qty:Number(e.value)})};
   add('d_gas','PGN Gas');add('d_water','Supplied Water (Industrial Water)');add('d_disc','Discharge Water (Sewage)');
   if(!rows.length)throw new Error('Isi minimal satu kolom.');
   const j=await sendToSheet({type:'harian',rows});
   const y=+ui.dDate.slice(0,4),mo=+ui.dDate.slice(5,7);
   rows.forEach(r=>addPending('day',{...r,fiscal_year:mo>=4?y:y-1,month:MONTHS[mo>=4?mo-4:mo+8]}));
   toast(`Tersimpan di Google Sheet (${j.inserted||0} baru, ${j.updated||0} diperbarui).`);
  }else if(id==='fKaizen'){
   const g=x=>document.getElementById(x).value.trim();
   const row={kaizen_id:ui.kzSel||'',title:g('kzTitle'),category:g('kzCat'),plant:g('kzPlant'),item:g('kzItem'),saving_qty_per_month:Number(g('kzQty')),start_fiscal_year:Number(g('kzFy')),start_month:g('kzMonth'),status:g('kzStatus'),pic:g('kzPic'),notes:g('kzNotes')};
   const j=await sendToSheet({type:'kaizen',row});
   addPending('kz',{...row,kaizen_id:j.kaizen_id||row.kaizen_id,unit:KUNIT[row.item]});
   ui.kzSel='';toast(`Kaizen tersimpan di Google Sheet (${j.kaizen_id}).`);
  }
  const src=LAST||{mon:[],day:[],kz:[]};mergePending(src);applyData(src,false);render();
 }catch(err){toast('Gagal menyimpan: '+err.message);if(btn){btn.disabled=false;btn.textContent=old}}
}
document.addEventListener('submit',e=>{const f=e.target;if(!f.dataset||!f.dataset.live)return;e.preventDefault();handleLiveSubmit(f.id)});
document.addEventListener('change',e=>{const id=e.target.id,v=e.target.value;
 if(id==='mPlant'){ui.mPlant=v;render()}else if(id==='mFy'){ui.mFy=+v;render()}else if(id==='mMonth'){ui.mMonth=+v;render()}
 else if(id==='dPlant'){ui.dPlant=v;render()}else if(id==='dDate'){if(v)ui.dDate=v;render()}
 else if(id==='kzSel'){ui.kzSel=v;render()}
 else if(id==='kzItem'){const l=document.getElementById('kzQtyLbl');if(l)l.textContent='Penghematan per bulan ('+KUNIT[v]+') *'}
 else if(id==='kzPlant'){const it=document.getElementById('kzItem');if(it&&v==='Plant 2'&&it.value==='PGN Gas'){it.value='Electricity';it.dispatchEvent(new Event('change',{bubbles:true}))}}
});

async function fetchTab(name){
 const r=await fetch(SHEET_PUB+'?gid='+SHEET_TABS[name]+'&single=true&output=csv&_='+Date.now(),{cache:'no-store'});
 if(!r.ok)throw new Error(name+': HTTP '+r.status);
 return r.text();
}
function setBadge(){
 let b=document.getElementById('liveBadge');
 if(!b){b=document.createElement('div');b.id='liveBadge';b.title='Klik untuk memuat ulang dari Google Sheet';b.onclick=()=>loadLive(true);
  b.style.cssText='position:fixed;right:12px;bottom:12px;z-index:60;font:700 11px Inter,system-ui,sans-serif;padding:7px 11px;border-radius:999px;box-shadow:0 2px 8px #0003;cursor:pointer';document.body.appendChild(b)}
 const m=LIVE_STATUS.mode,ok=m==='live';
 b.style.background=ok?'#e3f4e8':m==='memuat'?'#eef1f5':'#fff1d6';b.style.color=ok?'#1e7a3c':m==='memuat'?'#556':'#9a6200';
 b.textContent=ok?'● Live dari Google Sheet · '+LIVE_STATUS.at:m==='memuat'?'… memuat dari Google Sheet':'● Data cadangan · '+LIVE_STATUS.msg;
 const f=document.getElementById('srcFoot');if(f)f.textContent=ok?'Live dari Google Sheet · '+LIVE_STATUS.at:m==='memuat'?'Memuat dari Google Sheet…':'Sheet tidak terjangkau, memakai data cadangan.';
}
async function loadLive(manual){
 LIVE_STATUS={mode:'memuat',at:'',msg:''};setBadge();
 try{
  const [tm,th,tk]=await Promise.all([fetchTab('monitoring'),fetchTab('harian'),fetchTab('kaizen')]);
  const src=parseAll(tm,th,tk);mergePending(src);
  applyData(src,false);
  if(!db.records.length)throw new Error('tab Monitoring tidak berisi data yang dikenali');
  LIVE_STATUS={mode:'live',at:new Date().toLocaleString('id-ID',{dateStyle:'short',timeStyle:'short'}),msg:''};
 }catch(err){
  LIVE_STATUS={mode:'cadangan',at:'',msg:err.message};
  try{initialLoad()}catch(e){}
  if(manual)toast('Gagal memuat dari Google Sheet: '+err.message);
 }
 setBadge();render();
}
render();
setBadge();
loadLive(false);
</script>
</body>
